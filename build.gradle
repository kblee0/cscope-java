plugins {
    id 'java'
    id 'application'
}

group = 'io.cscope'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Eclipse JDT ASTParser
    implementation 'org.eclipse.jdt:org.eclipse.jdt.core:3.39.0'
    
    // Apache Commons CSV for exporting
    implementation 'org.apache.commons:commons-csv:1.10.0'
    
    // CLI Argument Parsing (Optional, using custom parser as requested but common-cli is helpful)
    implementation 'commons-cli:commons-cli:1.6.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'io.cscope.java.JdtProjectAnalyzerMain'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}
